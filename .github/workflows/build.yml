name: macOS ad hoc builds

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and package arm64 (ad hoc, non-notarized)
    runs-on: macos-26
    timeout-minutes: 30
    env:
      CONFIGURATION: release
      DEVBOX_SIGNING_IDENTITY: '-'
      ARCH: arm64
    steps:
      - name: Isolate build outputs
        run: |
          echo "BUILD_DIR=$RUNNER_TEMP/devbox-app" >> "$GITHUB_ENV"
          echo "SWIFT_BUILD_PATH=$RUNNER_TEMP/devbox-swift" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify native architecture and toolchain
        run: |
          test "$(uname -m)" = "$ARCH"
          xcodebuild -version
          swift --version
          python3 - <<'PY'
          import re, subprocess
          swift = subprocess.check_output(["swift", "--version"], text=True)
          version = tuple(map(int, re.search(r"Swift version (\d+)\.(\d+)", swift).groups()))
          assert version >= (6, 2), swift
          sdk = subprocess.check_output(["xcrun", "--sdk", "macosx", "--show-sdk-version"], text=True).strip()
          assert int(sdk.split(".")[0]) >= 26, sdk
          PY
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
            test "$GITHUB_REF_NAME" = "v$version"
          fi
      - name: Test without database integration
        run: |
          unset DEVBOX_TEST_MARIADB_SOCKET
          sh scripts/test.sh
      - name: Build release app
        run: sh scripts/build-app.sh
      - name: Verify and archive app and executable
        run: |
          app="$BUILD_DIR/DevBox.app"
          binary="$app/Contents/MacOS/DevBox"
          test "$(lipo -archs "$binary")" = "$ARCH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = 26.0
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app/Contents/Info.plist")" = DevBox
          test -s "$app/Contents/Resources/DevBox.icns"
          xcrun vtool -show-build "$binary"
          xcrun vtool -show-build "$binary" | grep -Eq 'minos[[:space:]]+26\.0([[:space:]]|$)'
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -F 'Signature=adhoc'
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$app" "artifacts/DevBox-macos26-$ARCH-adhoc-non-notarized-app.zip"
          # A bundle's executable signature binds Info.plist. Re-sign only a
          # separate copy so the standalone download is independently valid.
          standalone="$RUNNER_TEMP/devbox-standalone"
          mkdir -p "$standalone"
          cp "$binary" "$standalone/DevBox"
          codesign --force --sign - "$standalone/DevBox"
          codesign --verify --strict "$standalone/DevBox"
          ditto -c -k "$standalone" "artifacts/DevBox-macos26-$ARCH-adhoc-non-notarized-executable.zip"
          ditto -x -k "artifacts/DevBox-macos26-$ARCH-adhoc-non-notarized-executable.zip" "$RUNNER_TEMP/standalone-roundtrip"
          test -x "$RUNNER_TEMP/standalone-roundtrip/DevBox"
          codesign --verify --strict "$RUNNER_TEMP/standalone-roundtrip/DevBox"
          codesign --verify --strict "$app"
          (cd artifacts && shasum -a 256 ./*.zip > SHA256SUMS.txt)
      - name: Upload ad hoc, non-notarized downloads
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DevBox-macos26-arm64-adhoc-non-notarized
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish versioned app downloads
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download verified builds from this run
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p downloads
          gh run download "$GITHUB_RUN_ID" \
            --name "DevBox-macos26-arm64-adhoc-non-notarized" \
            --dir "$RUNNER_TEMP/build-arm64"
          (cd "$RUNNER_TEMP/build-arm64" && sha256sum --check SHA256SUMS.txt)
          cp "$RUNNER_TEMP/build-arm64/DevBox-macos26-arm64-adhoc-non-notarized-app.zip" downloads/
          (cd downloads && sha256sum ./*.zip > SHA256SUMS.txt)
      - name: Publish complete release
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          ## Downloads

          Requires **Apple Silicon (M1 or newer) and macOS 26 or newer**.

          - [Apple Silicon (M1 and newer)](https://github.com/$GH_REPO/releases/download/$TAG/DevBox-macos26-arm64-adhoc-non-notarized-app.zip)

          Starting with v0.3.1, releases are Apple Silicon-only. The last Intel download
          remains available in [v0.3.0](https://github.com/$GH_REPO/releases/tag/v0.3.0).

          Extract the ZIP and move **DevBox.app** into Applications.

          These personal-use builds are **ad-hoc signed, not Apple-notarized**.
          macOS may require approval in **System Settings → Privacy & Security → Open Anyway**.
          Updates may prompt for Keychain access again. Do not disable Gatekeeper globally.

          MariaDB features require a local server and a matching Homebrew MariaDB client library.
          EOF
          if gh release view "$TAG" --json isDraft,targetCommitish > existing.json 2>/dev/null; then
            # Retry our own incomplete draft, never overwrite a published release.
            jq -e --arg sha "$GITHUB_SHA" '.isDraft and .targetCommitish == $sha' existing.json >/dev/null
          else
            gh release create "$TAG" --verify-tag --target "$GITHUB_SHA" \
              --draft --title "DevBox $TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" downloads/*.zip downloads/SHA256SUMS.txt --clobber
          gh release edit "$TAG" --notes-file notes.md --draft=false --latest
